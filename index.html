<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101010">
  <title>MHS Heritage Guide | Dewan Optimis Audio</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 12px;
      background: transparent;
      color: #202020;
    }
    .player {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      padding: 16px;
      border: 1px solid #dedede;
      border-radius: 12px;
      background: #fff;
    }
    .eyebrow {
      margin: 0 0 5px;
      color: #666;
      font-size: 12px;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 17px;
      line-height: 1.35;
      font-weight: 600;
    }
    audio {
      display: block;
      width: 100%;
      height: 44px;
    }
    .note {
      margin: 9px 0 0;
      color: #666;
      font-size: 12px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <main class="player">
    <p class="eyebrow">MHS Heritage Guide · Audio Guide</p>
    <h1>The Story of Dewan Optimis</h1>
    <audio controls preload="metadata">
      <source src="dewan-optimis.mp3" type="audio/mpeg">
      Your browser does not support the audio player.
    </audio>
    <p class="note">English audio guide · Approximately 1 minute 16 seconds</p>
  </main>
</body>
</html>
