<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Dewan Optimis Audio Guide</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      background: transparent;
      color: #202020;
      font-family: Arial, Helvetica, sans-serif;
    }
    .audio-wrap {
      width: 100%;
      padding: 4px 0;
    }
    audio {
      display: block;
      width: 100%;
      height: 48px;
      margin: 0;
    }
    .caption {
      margin: 5px 2px 0;
      color: #666;
      font-size: 12px;
      line-height: 1.35;
    }
  </style>
</head>
<body>
  <main class="audio-wrap">
    <audio controls preload="metadata">
      <source src="dewan-optimis.mp3" type="audio/mpeg">
      Your browser does not support the audio player.
    </audio>
    <p class="caption">The Story of Dewan Optimis · English audio guide · 1:16</p>
  </main>
</body>
</html>
